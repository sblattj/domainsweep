name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      # Not the live suite: test/live.test.ts is gated by DOMAINSWEEP_LIVE and skips.
      - run: bun test
      - run: bun run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  node:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: chmod +x dist/cli.js
      - run: node dist/cli.js --version
      - run: node dist/cli.js scryb --dry-run --limit 3
      - name: library import
        run: node -e "import('./dist/index.js').then(m=>{if(typeof m.hunt!=='function')throw new Error('hunt missing');console.log('exports:',Object.keys(m).join(','))})"
